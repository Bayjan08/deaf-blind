<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    #container { position: relative; width: 100vw; height: 100vh; }

    /* Hidden video element — MediaPipe reads from this */
    #video { display: none; }

    /* Canvas fills the screen and mirrors the selfie camera */
    #canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);   /* mirror for front camera — natural selfie view */
    }

    /* Gesture name pill at the bottom */
    #pill {
      position: absolute; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #00E5FF;
      padding: 10px 28px;
      border-radius: 24px;
      font: 700 18px/1 'Arial', sans-serif;
      letter-spacing: 0.5px;
      border: 2px solid #00E5FF;
      white-space: nowrap;
      transition: border-color 0.2s;
      z-index: 10;
    }

    /* Hold progress bar that grows inside the pill border */
    #progress-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: #00FF88;
      border-radius: 0 0 24px 24px;
      width: 0%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="pill">
    Загрузка...
    <div id="progress-bar"></div>
  </div>
</div>

<!-- MediaPipe Hands CDN (classic, no ES modules — works in WebView) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const MEANINGS = {
  hello : 'Привет 👋',
  yes   : 'Да 👍',
  no    : 'Нет ☝️',
  stop  : 'Стоп ✊',
  good  : 'Хорошо ✌️',
  help  : 'Помощь 🤘',
  bad   : 'Плохо 👎',
  thanks: 'Спасибо 🙏',
};

// Landmark indices (MediaPipe Hands, 21 points)
// 0=WRIST, 1=THUMB_CMC, 2=THUMB_MCP, 3=THUMB_IP, 4=THUMB_TIP,
// 5=INDEX_MCP … 8=INDEX_TIP,  9=MID_MCP … 12=MID_TIP,
// 13=RING_MCP … 16=RING_TIP, 17=PINKY_MCP … 20=PINKY_TIP
const TIPS = [4, 8, 12, 16, 20];   // fingertip indices
const PIPS = [3, 6, 10, 14, 18];   // pip / knuckle indices just below tip

const HOLD_THRESHOLD = 10; // frames to hold before sending to Flutter

// ─── State ────────────────────────────────────────────────────────────────────
let holdGesture = '';
let holdCount   = 0;

const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const pill     = document.getElementById('pill');
const progress = document.getElementById('progress-bar');

// ─── Gesture classifier ───────────────────────────────────────────────────────
// Uses normalized landmark coordinates [0,1].
// Y increases downward, so tip.y < pip.y means the finger points UP.
// Thumb uses X axis (left/right spread) because it rotates differently.
function classify(lm) {
  // Mirrored (front cam): thumb tip is to the RIGHT of thumb ip when up
  const thumbUp  = lm[TIPS[0]].x > lm[PIPS[0]].x;
  const indexUp  = lm[TIPS[1]].y < lm[PIPS[1]].y;
  const middleUp = lm[TIPS[2]].y < lm[PIPS[2]].y;
  const ringUp   = lm[TIPS[3]].y < lm[PIPS[3]].y;
  const pinkyUp  = lm[TIPS[4]].y < lm[PIPS[4]].y;

  // Open palm: all 5 fingers up → hello
  if (thumbUp && indexUp && middleUp && ringUp && pinkyUp) return 'hello';

  // Thumbs-up only → yes
  if (thumbUp && !indexUp && !middleUp && !ringUp && !pinkyUp) return 'yes';

  // Fist — all closed → stop
  if (!thumbUp && !indexUp && !middleUp && !ringUp && !pinkyUp) return 'stop';

  // Peace/victory — index + middle → good
  if (!thumbUp && indexUp && middleUp && !ringUp && !pinkyUp) return 'good';

  // Index only → no
  if (!thumbUp && indexUp && !middleUp && !ringUp && !pinkyUp) return 'no';

  // Devil horns — index + pinky → help
  if (!thumbUp && indexUp && !middleUp && !ringUp && pinkyUp) return 'help';

  // Three fingers — index + middle + ring → thanks
  if (!thumbUp && indexUp && middleUp && ringUp && !pinkyUp) return 'thanks';

  // Thumbs-down (thumb on left side when mirrored) → bad
  if (!thumbUp && !indexUp && !middleUp && !ringUp && !pinkyUp) return 'bad';

  return null;
}

// ─── Draw helpers ─────────────────────────────────────────────────────────────
function drawDots(lm, w, h) {
  for (let i = 0; i < lm.length; i++) {
    const x = lm[i].x * w;
    const y = lm[i].y * h;
    const isTip   = TIPS.includes(i);
    const isWrist = i === 0;
    const r = isWrist ? 8 : (isTip ? 7 : 5);

    // Outer glow
    ctx.beginPath();
    ctx.arc(x, y, r + 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,229,255,0.18)';
    ctx.fill();

    // Filled dot
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = isTip ? '#FF4081' : '#00E5FF';   // pink tips, cyan joints
    ctx.fill();

    // White center for wrist landmark
    if (isWrist) {
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
  }
}

// ─── MediaPipe callback ───────────────────────────────────────────────────────
function onResults(results) {
  if (!results.image) return;

  // Resize canvas to match video frame
  canvas.width  = results.image.width;
  canvas.height = results.image.height;

  // Draw the camera frame (canvas itself is CSS-mirrored)
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  const detected = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;

  if (detected) {
    const lm = results.multiHandLandmarks[0];
    const w  = canvas.width;
    const h  = canvas.height;

    // Draw MediaPipe skeleton using the built-in utility
    drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: 'rgba(0,229,255,0.65)', lineWidth: 2 });

    // Draw custom dots over the skeleton
    drawDots(lm, w, h);

    // Classify gesture and update hold counter
    const gesture = classify(lm);

    if (gesture && gesture === holdGesture) {
      holdCount++;
      progress.style.width = Math.min(holdCount / HOLD_THRESHOLD * 100, 100) + '%';

      if (holdCount >= HOLD_THRESHOLD) {
        holdCount = 0;
        progress.style.width = '0%';
        // Send to Flutter via JS channel
        if (window.GestureChannel) {
          GestureChannel.postMessage(gesture);
        } else if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('GestureChannel', gesture);
        }
      }
    } else {
      holdGesture = gesture || '';
      holdCount = 0;
      progress.style.width = '0%';
    }

    // Update pill
    if (gesture) {
      pill.firstChild.textContent = (MEANINGS[gesture] || gesture) + ' ';
      pill.style.borderColor = '#00FF88';
    } else {
      pill.firstChild.textContent = '🔍 Распознаю жест... ';
      pill.style.borderColor = '#00E5FF';
    }
  } else {
    holdGesture = '';
    holdCount   = 0;
    progress.style.width = '0%';
    pill.firstChild.textContent = '✋ Покажите руку ';
    pill.style.borderColor = '#555';
  }
}

// ─── MediaPipe Hands setup ────────────────────────────────────────────────────
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
});

hands.setOptions({
  selfieMode            : true,   // mirror mode
  maxNumHands           : 1,
  modelComplexity       : 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence : 0.5,
});

hands.onResults(onResults);

// ─── Camera bootstrap ─────────────────────────────────────────────────────────
const video = document.getElementById('video');

navigator.mediaDevices.getUserMedia({
  video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
  audio: false,
})
.then((stream) => {
  video.srcObject = stream;
  video.style.display = 'block';

  const camera = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width : 640,
    height: 480,
  });
  camera.start();
  pill.firstChild.textContent = '✋ Покажите руку ';
  pill.style.borderColor = '#555';
})
.catch((err) => {
  pill.firstChild.textContent = '❌ ' + err.message;
  pill.style.borderColor = '#f44';
  console.error('Camera error:', err);
});
</script>
</body>
</html>
