<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; }

    /* Native video render (cheap) — NOT redrawn into canvas each frame */
    #video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    /* Transparent overlay — draws ONLY the skeleton */
    #overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    #pill {
      position: absolute; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #00E5FF;
      padding: 10px 22px;
      border-radius: 24px;
      font: 700 15px/1 'Arial', sans-serif;
      border: 2px solid #555;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden; text-overflow: ellipsis;
      z-index: 10;
    }
    #progress-bar {
      position: absolute; bottom: 0; left: 0;
      height: 3px; background: #00FF88;
      border-radius: 0 0 24px 24px;
      width: 0%; transition: width 0.08s linear;
    }
    #rec-dot {
      display: none;
      position: absolute; top: 14px; left: 50%;
      transform: translateX(-50%);
      background: rgba(244,67,54,0.9);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font: 700 13px 'Arial', sans-serif;
      z-index: 30;
    }
  </style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="rec-dot">⏺ ЗАПИСЬ ЖЕСТА</div>
  <div id="pill">
    Загрузка...
    <div id="progress-bar"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const TIPS = [4, 8, 12, 16, 20];

// Auto-motion capture
const START_VEL   = 0.020;  // wrist movement (normalised) to START recording
const STOP_VEL    = 0.012;  // below this = "settling"
const STILL_HOLD  = 6;      // consecutive still frames → end of sign
const MIN_FRAMES  = 10;     // shorter than this = noise, discard
const MAX_FRAMES  = 48;     // hard cap on a single capture
const SEND_FRAMES = 32;     // resample to exactly this many for Slovo
const COOLDOWN_MS = 1200;   // pause after a prediction
const CAP_W = 320, CAP_H = 240;  // JPEG capture size (4:3, matches camera)

// ─── State ────────────────────────────────────────────────────────────────────
let state        = 'idle';   // idle | capturing | sending | cooldown
let jpegBuffer   = [];
let prevWrist    = null;
let stillCount   = 0;
let mpBusy       = false;     // skip frames while MediaPipe is still working

// ─── DOM ──────────────────────────────────────────────────────────────────────
const video    = document.getElementById('video');
const overlay  = document.getElementById('overlay');
const octx     = overlay.getContext('2d');
const pill     = document.getElementById('pill');
const progress = document.getElementById('progress-bar');
const recDot   = document.getElementById('rec-dot');

// Off-screen canvas for JPEG capture (used ONLY while recording)
const capCv  = document.createElement('canvas');
capCv.width  = CAP_W; capCv.height = CAP_H;
const capCtx = capCv.getContext('2d');

// ─── Send to Flutter ──────────────────────────────────────────────────────────
function sendToFlutter(payload) {
  const str = typeof payload === 'string' ? payload : JSON.stringify(payload);
  if (window.flutter_inappwebview) {
    window.flutter_inappwebview.callHandler('GestureChannel', str);
  } else if (window.GestureChannel) {
    GestureChannel.postMessage(str);
  }
}

function setPill(text, color) {
  pill.firstChild.textContent = text + ' ';
  pill.style.borderColor = color || '#555';
}

// ─── Capture lifecycle ─────────────────────────────────────────────────────────
function startCapture() {
  state = 'capturing';
  jpegBuffer = [];
  stillCount = 0;
  recDot.style.display = 'block';
  setPill('⏺ Записываю жест…', '#f44336');
}

function pushFrame() {
  // Draw RAW (un-mirrored) video frame → JPEG. Slovo expects natural orientation.
  capCtx.drawImage(video, 0, 0, CAP_W, CAP_H);
  const b64 = capCv.toDataURL('image/jpeg', 0.8).split(',')[1];
  jpegBuffer.push(b64);
  progress.style.width = Math.min(jpegBuffer.length / SEND_FRAMES * 100, 100) + '%';
}

function finishCapture() {
  recDot.style.display = 'none';

  if (jpegBuffer.length < MIN_FRAMES) {
    // Too short — was just noise. Reset to idle.
    jpegBuffer = [];
    state = 'idle';
    progress.style.width = '0%';
    return;
  }

  state = 'sending';
  setPill('🧠 Распознаю…', '#FF9800');

  // Resample buffer to exactly SEND_FRAMES, evenly spaced
  const frames = [];
  for (let i = 0; i < SEND_FRAMES; i++) {
    const idx = Math.floor(i * (jpegBuffer.length - 1) / (SEND_FRAMES - 1));
    frames.push(jpegBuffer[idx]);
  }
  jpegBuffer = [];
  sendToFlutter({ type: 'clip', frames });

  // Flutter calls clipDone() when the backend responds; meanwhile cooldown
  enterCooldown();
}

function enterCooldown() {
  state = 'cooldown';
  setTimeout(() => {
    state = 'idle';
    progress.style.width = '0%';
    setPill('✋ Покажите жест — запись начнётся сама', '#555');
  }, COOLDOWN_MS);
}

// Called from Flutter after the word is shown (optional UX hook)
window.clipDone = function (word) {
  if (word) setPill('✅ ' + word, '#00FF88');
};

// ─── MediaPipe results ─────────────────────────────────────────────────────────
function onResults(results) {
  mpBusy = false;

  // Resize overlay to match the actual video resolution once known
  if (overlay.width !== (results.image?.width || 0) && results.image) {
    overlay.width  = results.image.width;
    overlay.height = results.image.height;
  }
  octx.clearRect(0, 0, overlay.width, overlay.height);

  const hand = results.multiHandLandmarks && results.multiHandLandmarks[0];

  if (hand) {
    // Skeleton overlay (cheap — no camera redraw)
    drawConnectors(octx, hand, HAND_CONNECTIONS, { color: 'rgba(0,229,255,0.65)', lineWidth: 3 });
    for (let i = 0; i < hand.length; i++) {
      const x = hand[i].x * overlay.width, y = hand[i].y * overlay.height;
      const isTip = TIPS.includes(i), isWrist = i === 0;
      octx.beginPath();
      octx.arc(x, y, isWrist ? 8 : (isTip ? 7 : 5), 0, Math.PI * 2);
      octx.fillStyle = isTip ? '#FF4081' : '#00E5FF';
      octx.fill();
    }

    // ── Motion tracking on the wrist ──
    const wrist = hand[0];
    let vel = 0;
    if (prevWrist) {
      const dx = wrist.x - prevWrist.x, dy = wrist.y - prevWrist.y;
      vel = Math.sqrt(dx * dx + dy * dy);
    }
    prevWrist = { x: wrist.x, y: wrist.y };

    if (state === 'idle') {
      setPill('✋ Покажите жест — запись начнётся сама', '#00E5FF');
      if (vel > START_VEL) startCapture();
    } else if (state === 'capturing') {
      pushFrame();
      if (vel < STOP_VEL) {
        if (++stillCount >= STILL_HOLD) finishCapture();
      } else {
        stillCount = 0;
      }
      if (jpegBuffer.length >= MAX_FRAMES) finishCapture();
    }
  } else {
    // No hand visible
    prevWrist = null;
    if (state === 'capturing') {
      // hand left mid-capture → finish with what we have
      finishCapture();
    } else if (state === 'idle') {
      setPill('✋ Покажите руку перед камерой', '#555');
    }
  }
}

// ─── MediaPipe + Camera ───────────────────────────────────────────────────────
let currentFacingMode = 'user';
let activeStream = null, activeCamera = null;

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
});
hands.setOptions({
  selfieMode: false,        // raw orientation — matches Slovo training data
  maxNumHands: 1,
  modelComplexity: 0,       // LITE model — ~3× faster, no freeze
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.5,
});
hands.onResults(onResults);

function startCamera() {
  if (activeCamera) activeCamera.stop();
  if (activeStream) activeStream.getTracks().forEach(t => t.stop());
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false,
  }).then(stream => {
    activeStream = stream;
    video.srcObject = stream;
    activeCamera = new Camera(video, {
      onFrame: async () => {
        if (mpBusy) return;     // skip if previous inference not done — prevents backlog freeze
        mpBusy = true;
        await hands.send({ image: video });
      },
      width: 640, height: 480,
    });
    activeCamera.start();
    setPill('✋ Покажите руку перед камерой', '#555');
  }).catch(err => {
    setPill('❌ ' + err.message, '#f44');
    console.error(err);
  });
}

function switchCamera() {
  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  startCamera();
}

window.switchCamera = switchCamera;
startCamera();
</script>
</body>
</html>
